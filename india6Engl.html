<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Let's continue</title></head
  ><style>
    body {
      height: 100vh;
      overflow: hidden;
    }
    .container {
      margin: 2%;
      height: 90vh;
      position: relative;
    }
    #cats {
      position: absolute;
      left: 10%;
      top: 200%;
    }
    .main {
      position: absolute;
      top: 5%;
      left: 15%;
    }
  </style>
  <body>
    <div>
      <div class="container">
        <img src="Images/flag.jpg" alt="castle" width="100%" height="98%" />
      </div>
      <div class="main">
        <h1>Your round trip is complete.</h1>
        <h1 id="pageTitle">Find out what's next...</h1>

        <div class="action-section" style="margin-top: 40px">
          <a
            id="nextStepLink"
            class="hidden"
            style="
              display: inline-block;
              background-color: #800020;
              color: white;
              text-decoration: none;
              padding: 15px 35px;
              font-size: 18px;
              border-radius: 30px;
              box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
              font-weight: bold;
              transition: background-color 0.2s;
            "
          ></a>
        </div>

        <img src="Images/cats-bubbles.gif" alt="cats" id="cats" />
      </div>
    </div>

    <script src="india4Engl.js"></script>
  </body>
</html>
