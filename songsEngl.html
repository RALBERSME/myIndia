<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Raga & Rhythm - Magical Sounds of India</title>
    <style>
      :root {
        --saffron: #ff9933;
        --white: #ffffff;
        --green: #138808;
        --peacock-blue: #005a9c;
        --peacock-teal: #00a896;
        --magenta: #d8005a;
        --dark-bg: #0b0c10;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }

      body {
        background: radial-gradient(
          circle at center,
          #1a0826 0%,
          var(--dark-bg) 100%
        );
        background: url(Images/stoff.jpg);
        background-repeat: no-repeat;
        background-size: cover;
        color: var(--white);
        min-height: 100vh;
        overflow-x: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
      }

      header {
        text-align: center;
        padding: 40px 20px;
        background: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.5) 0%,
          transparent 100%
        );
        width: 100%;
      }

      h1 {
        font-size: 3rem;
        text-transform: uppercase;
        letter-spacing: 4px;
        background: linear-gradient(
          45deg,
          var(--saffron),
          var(--magenta),
          var(--peacock-teal)
        );
        background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 10px;
        text-shadow: 0 0 30px rgba(216, 0, 90, 0.3);
      }

      header p {
        font-size: 1.2rem;
        color: #ccc;
        font-style: italic;
      }

      .peacock-container {
        position: relative;
        width: 500px;
        height: 400px;
        margin: 20px auto;
        display: flex;
        align-items: flex-end;
        justify-content: center;
      }

      .peacock-body {
        position: absolute;
        width: 70px;
        height: 110px;
        background: linear-gradient(135deg, var(--peacock-blue), #002d54);
        border-radius: 50% 50% 40% 40%;
        bottom: 20px;
        z-index: 10;
        box-shadow:
          0 10px 30px rgba(0, 0, 0, 0.5),
          inset 0 5px 15px rgba(255, 255, 255, 0.2);
        cursor: pointer;
        transition: transform 0.3s;
      }

      .peacock-body::before {
        content: "";
        position: absolute;
        top: -30px;
        left: 15px;
        width: 40px;
        height: 40px;
        background: var(--peacock-blue);
        border-radius: 50%;
      }

      .peacock-container.playing .peacock-body {
        animation: pulse 1.5s infinite alternate ease-in-out;
      }

      .feather {
        position: absolute;
        bottom: 40px;
        width: 55px;
        height: 180px;
        background: linear-gradient(
          to top,
          transparent,
          var(--peacock-teal),
          var(--green)
        );
        border-radius: 50% 50% 0 0;
        transform-origin: bottom center;
        cursor: pointer;
        transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding-top: 15px;
        box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
      }

      .feather-eye {
        width: 35px;
        height: 35px;
        background: radial-gradient(
          circle,
          var(--peacock-blue) 30%,
          var(--magenta) 60%,
          var(--saffron) 100%
        );
        border-radius: 50%;
        border: 2px solid var(--white);
        transition: transform 0.3s;
      }

      .feather-number {
        font-size: 0.8rem;
        font-weight: bold;
        color: var(--white);
        margin-top: 10px;
        background: rgba(0, 0, 0, 0.4);
        padding: 2px 6px;
        border-radius: 10px;
      }

      @media (hover: hover) {
        .feather:hover {
          filter: brightness(1.3);
          bottom: 50px;
        }
        .feather:hover .feather-eye {
          transform: scale(1.2);
        }
      }

      .feather:active,
      .feather.active {
        filter: brightness(1.4);
        bottom: 52px;
      }

      .feather:active .feather-eye,
      .feather.active .feather-eye {
        transform: scale(1.25);
        box-shadow: 0 0 15px var(--saffron);
      }

      .feather:nth-child(1) {
        transform: rotate(-75deg);
      }
      .feather:nth-child(2) {
        transform: rotate(-50deg);
      }
      .feather:nth-child(3) {
        transform: rotate(-25deg);
      }
      .feather:nth-child(4) {
        transform: rotate(0deg);
      }
      .feather:nth-child(5) {
        transform: rotate(25deg);
      }
      .feather:nth-child(6) {
        transform: rotate(50deg);
      }
      .feather:nth-child(7) {
        transform: rotate(75deg);
      }

      .player-panel {
        background: rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
        width: 90%;
        max-width: 600px;
        padding: 30px;
        border-radius: 24px;
        margin-bottom: 40px;
        text-align: center;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        z-index: 20;
      }

      .track-info h2 {
        font-size: 1.5rem;
        color: var(--saffron);
        margin-bottom: 5px;
      }

      .track-info p {
        color: #aaa;
        font-size: 0.95rem;
        margin-bottom: 20px;
      }

      .controls {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 25px;
      }

      .btn {
        background: none;
        border: none;
        color: var(--white);
        font-size: 1.8rem;
        cursor: pointer;
        transition:
          transform 0.2s,
          color 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      @media (hover: hover) {
        .btn:hover {
          color: var(--peacock-teal);
          transform: scale(1.1);
        }
      }

      .btn-play {
        background: linear-gradient(45deg, var(--saffron), var(--magenta));
        width: 60px;
        height: 60px;
        border-radius: 50%;
        font-size: 1.5rem;
        box-shadow: 0 4px 15px rgba(216, 0, 90, 0.4);
      }

      @keyframes pulse {
        0% {
          transform: scale(1);
        }
        100% {
          transform: scale(1.08);
        }
      }

      @media (max-width: 600px) {
        h1 {
          font-size: 2rem;
        }
        header p {
          font-size: 1rem;
        }
        .peacock-container {
          transform: scale(0.7);
          height: 320px;
          margin: 0 auto;
          width: 100%;
        }
        .player-panel {
          padding: 20px;
          margin-bottom: 20px;
        }
      }
      .beach-btn {
        position: relative;
        display: inline-flex;
        justify-content: center;
        align-items: center;
        width: 220px;
        height: 45px;
        background-color: #f7d070;
        border: 2px solid #e5ba55;
        border-radius: 30px;
        text-decoration: none;
        overflow: hidden;
        box-shadow: 0 4px 15px rgba(247, 208, 112, 0.3);
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
        margin-top: 15px;
      }

      .beach-btn .btn-text {
        position: relative;
        z-index: 2;
        font-family: "Arial", sans-serif;
        font-size: 16px;
        font-weight: bold;
        color: #2c3e50;
        text-transform: uppercase;
        letter-spacing: 1px;
        transition: color 0.4s ease;
      }

      .beach-btn .wave-bg {
        position: absolute;
        top: 100%;
        left: -50%;
        width: 200%;
        height: 400%;
        background: #0c73bc;
        border-radius: 40%;
        z-index: 1;
        transition: top 0.6s ease;
      }

      .beach-btn:hover {
        transform: translateY(-3px);
        box-shadow: 0 8px 20px rgba(52, 152, 219, 0.4);
      }

      .beach-btn:hover .btn-text {
        color: #ffffff;
      }

      .beach-btn:hover .wave-bg {
        top: -60%;
        animation: ocean-wave 4s linear infinite;
      }

      @keyframes ocean-wave {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 900px) {
        .container {
          margin: 20px auto;
          padding: 0 15px;
        }
        .split {
          grid-template-columns: 1fr;
          gap: 20px;
        }
        .image-wrapper {
          height: 400px;
        }
        img {
          height: 100%;
        }
        h1 {
          font-size: 2.2rem;
        }
      }

      @media (max-width: 480px) {
        .container {
          margin: 10px auto;
          padding: 0 10px;
        }
        .split {
          gap: 15px;
        }
        .image-wrapper {
          height: 250px;
        }
        .right {
          padding: 20px;
        }
        h1 {
          font-size: 1.8rem;
        }
        h2 {
          font-size: 1.1rem;
        }
        .beach-btn {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Raga & Rhythm</h1>
      <p>Experience the magic and vibrant colors of Indian rhythms</p>
    </header>

    <div class="peacock-container" id="peacockContainer">
      <div class="feather" data-index="0">
        <div class="feather-eye"></div>
        <span class="feather-number">1</span>
      </div>
      <div class="feather" data-index="1">
        <div class="feather-eye"></div>
        <span class="feather-number">2</span>
      </div>
      <div class="feather" data-index="2">
        <div class="feather-eye"></div>
        <span class="feather-number">3</span>
      </div>
      <div class="feather" data-index="3">
        <div class="feather-eye"></div>
        <span class="feather-number">4</span>
      </div>
      <div class="feather" data-index="4">
        <div class="feather-eye"></div>
        <span class="feather-number">5</span>
      </div>
      <div class="feather" data-index="5">
        <div class="feather-eye"></div>
        <span class="feather-number">6</span>
      </div>
      <div class="feather" data-index="6">
        <div class="feather-eye"></div>
        <span class="feather-number">7</span>
      </div>
      <div class="peacock-body" id="peacockBody"></div>
    </div>

    <div class="player-panel">
      <div class="track-info">
        <h2 id="trackTitle">Select a feather</h2>
        <p id="trackGenre">Click on a feather to play music</p>
      </div>

      <div class="controls">
        <button class="btn" id="btnPrev">⏮</button>
        <button class="btn btn-play" id="btnPlay">▶</button>
        <button class="btn" id="btnNext">⏭</button>
      </div>
      <a href="musicEngl.html" class="beach-btn">
        <span class="btn-text">➥ back </span>
        <span class="wave-bg"></span>
      </a>
    </div>

    <audio id="audioPlayer" preload="auto"></audio>

    <script>
      const playlist = [
        {
          title: "India Drums",
          genre: "Alex Morgan",
          src: "alex-morgan-india-drums.mp3",
        },
        {
          title: "Indian Classical Raga",
          genre: "Alex Morgan",
          src: "alex-morgan-indian-classical-raga.mp3",
        },
        {
          title: "Perccursion of India",
          genre: "Fidelfortune",
          src: "fidelfortune-perccusion-of-india.mp3",
        },
        {
          title: "Festival of joy",
          genre: "NKBloom",
          src: "nkbloom-festival-of-joy.mp3",
        },
        {
          title: "chudiyan (Indian Song)",
          genre: "Bannyboy",
          src: "bannyboy-chudiyan.mp3",
        },
        {
          title: "Colors of Joy (Holi Festival India)",
          genre: "Liberty Beats",
          src: "libertybeats-colors-of-joy.mp3",
        },
        {
          title: "Romantic Song",
          genre: "Teri Ye Adaa",
          src: "kontraa-teri-ye-adaa.mp3",
        },
      ];
      let currentTrackIndex = 0;
      let isPlaying = false;

      const audioPlayer = document.getElementById("audioPlayer");
      const btnPlay = document.getElementById("btnPlay");
      const btnPrev = document.getElementById("btnPrev");
      const btnNext = document.getElementById("btnNext");
      const trackTitle = document.getElementById("trackTitle");
      const trackGenre = document.getElementById("trackGenre");
      const peacockContainer = document.getElementById("peacockContainer");
      const feathers = document.querySelectorAll(".feather");
      const peacockBody = document.getElementById("peacockBody");

      function loadTrack(index) {
        currentTrackIndex = index;
        const track = playlist[index];

        audioPlayer.src = track.src;

        trackTitle.textContent = track.title;
        trackGenre.textContent = track.genre;

        feathers.forEach((f, i) => {
          if (i === index) {
            f.classList.add("active");
          } else {
            f.classList.remove("active");
          }
        });
      }

      function playTrack() {
        audioPlayer
          .play()
          .then(() => {
            isPlaying = true;
            btnPlay.textContent = "⏸";
            peacockContainer.classList.add("playing");
          })
          .catch((e) => {
            console.log(
              "Wiedergabe-Fehler abgefangen. Erfordert echten Klick:",
              e,
            );
            isPlaying = false;
            btnPlay.textContent = "▶";
            peacockContainer.classList.remove("playing");
          });
      }

      function pauseTrack() {
        audioPlayer.pause();
        isPlaying = false;
        btnPlay.textContent = "▶";
        peacockContainer.classList.remove("playing");
      }

      function togglePlay() {
        if (isPlaying) {
          pauseTrack();
        } else {
          playTrack();
        }
      }

      function nextTrack() {
        let nextIndex = (currentTrackIndex + 1) % playlist.length;
        loadTrack(nextIndex);
        playTrack();
      }

      function prevTrack() {
        let prevIndex =
          (currentTrackIndex - 1 + playlist.length) % playlist.length;
        loadTrack(prevIndex);
        playTrack();
      }

      btnPlay.addEventListener("click", () => {
        if (!audioPlayer.src || audioPlayer.src === window.location.href) {
          loadTrack(0);
        }
        togglePlay();
      });
      peacockBody.addEventListener("click", togglePlay);
      btnNext.addEventListener("click", nextTrack);
      btnPrev.addEventListener("click", prevTrack);

      feathers.forEach((feather, index) => {
        feather.addEventListener("click", () => {
          loadTrack(index);
          playTrack();
        });
      });

      audioPlayer.addEventListener("ended", nextTrack);

      loadTrack(currentTrackIndex);
    </script>
  </body>
</html>
