<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Goodbye</title>
  </head>
  <style>
    body {
      height: 100vh;
      background-image: linear-gradient(
        to right bottom,
        rgb(249, 196, 196),
        rgb(248, 236, 236)
      );
    }
    .container {
      margin: 5%;
      padding: 5%;
      height: 60vh;
      background-image: url(Images/mandala.png);
      background-size: 2cqmax;
      border: 5px dashed orange;
    }

    #person {
      border-radius: 50%;
      height: 250px;
      width: 250px;
      transform: translateY(120px);
    }
    h3 {
      text-align: center;
    }
    .split {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      height: 50vh;
    }
    img {
      height: 350px;
    }
    @media (min-width: 900px) {
      .split {
        display: flex;
        flex-direction: row;
        justify-content: center;
        gap: 50px;
        height: 50vh;
      }
      img {
        height: 95%;
      }
      #person {
        overflow: hidden;
        display: block;
        border-radius: 50%;
        height: 450px;
        width: 450px;
        transform: translateY(0px);
      }
    }
  </style>
  <body>
    <div class="container">
      <h1>Ich habe mich gefreut, mit Dir durch Indien zu reisen.</h1>

      <h2>
        Nun sind wir am Ende der Reise angekommen <br />und es ist Zeit, sich zu
        verabschieden.
      </h2>

      <div class="split">
        <img id="person" src="Images/man.jpg" alt="man" />
        <div class="left">
          <img src="Images/bye.gif" alt="bye" />
          <h3>
            Reinhild's <em>myIndia</em> - copyright &copy; 2026 all rights
            reserved
          </h3>
        </div>
      </div>
    </div>
    <script src="india4.js"></script>
  </body>
</html>
