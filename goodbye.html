<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Goodbye</title>
  </head>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      height: 100vh;
      background-image: linear-gradient(
        to right bottom,
        rgb(249, 196, 196),
        rgb(248, 236, 236)
      );
    }
    .container {
      margin: 5%;
      padding: 5%;
      height: 60vh;
      background-image: url(Images/mandala.png);
      background-size: 2cqmax;
      border: 5px dashed orange;
    }

    #person {
      border-radius: 50%;
      height: 180px;
      width: 180px;
      object-fit: cover;
      transform: translateY(0);
    }
    h3 {
      text-align: center;
    }
    .split {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      min-height: 100vh;
      padding: 20px 20px 60px 20px;
    }
    img {
      height: 270px;
    }
    .beach-btn {
      position: relative;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      max-width: 300px;
      height: 55px;
      background-color: rgb(215, 119, 135);
      border: 2px solid #0c8fe1;
      border-radius: 30px;
      text-decoration: none;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(247, 208, 112, 0.3);
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
      padding: 0 20px;
    }

    .beach-btn .btn-text {
      position: relative;
      z-index: 2;
      font-size: 15px;
      font-weight: bold;
      color: white;
      letter-spacing: 0.5px;
      transition: color 0.4s ease;
      white-space: nowrap;
    }

    .beach-btn .wave-bg {
      position: absolute;
      top: 100%;
      left: -50%;
      width: 200%;
      height: 400%;
      background: #3498db;
      border-radius: 40%;
      z-index: 1;
      transition: top 0.6s ease;
    }

    .beach-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(52, 152, 219, 0.4);
    }

    .beach-btn:hover .btn-text {
      color: #ffffff;
    }

    .beach-btn:hover .wave-bg {
      top: -60%;
      animation: ocean-wave 4s linear infinite;
    }

    @keyframes ocean-wave {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }
    .left {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 100%;
    }
    #byeGif {
      height: auto;
      max-height: 200px;
      width: auto;
      max-width: 100%;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 100%;
      align-items: center;
    }
    @media (min-width: 900px) {
      .split {
        flex-direction: row;
        gap: 60px;
        height: 60vh;
        min-height: auto;
        padding: 20px;
        margin-bottom: 0;
      }

      #person {
        height: 400px;
        width: 400px;
      }

      .left {
        align-items: flex-start;
      }

      .links {
        flex-direction: row;
        width: auto;
      }
      .beach-btn {
        max-width: 320px;
      }
    }
  </style>
  <body>
    <div class="container">
      <h1>Ich habe mich gefreut, mit Dir durch Indien zu reisen.</h1>

      <h2>
        Nun sind wir am Ende der Reise angekommen <br />und es ist Zeit, sich zu
        verabschieden.
      </h2>

      <div class="split">
        <img id="person" src="Images/man.jpg" alt="man" />
        <div class="left">
          <img id="byeGif" src="Images/bye.gif" alt="bye" />
          <div class="links">
            <a href="specials.html" class="beach-btn">
              <span class="btn-text">➥ etwas vermisst? (Specials)</span>
              <span class="wave-bg"></span> </a
            ><a href="inhaltsverzeichnis.html" class="beach-btn">
              <span class="btn-text">➥ zum Inhaltsverzeichnis</span>
              <span class="wave-bg"></span>
            </a>
          </div>
          <h3>
            Reinhild's <em>myIndia</em> - copyright &copy; 2026 all rights
            reserved
          </h3>
          <br /><br />
        </div>
      </div>
    </div>
    <script>
      const gewaehlteThemen = ["goodbye"];
      localStorage.setItem(
        "indienReiseThemen",
        JSON.stringify(gewaehlteThemen),
      );
    </script>
    <script src="india4.js"></script>
  </body>
</html>
