<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Strand & Entspannung</title>
  </head>
  <style>
    body {
      min-height: 100vh;
      background-color: #c0e9f9;
      background-image: url("data:image/svg+xml,%3Csvg xmlns='http://w3.org' width='100' height='18' viewBox='0 0 100 18'%3E%3Cpath fill='%2372e0d8' fill-opacity='0.54' d='M61.82 18c3.47-1.45 6.86-3.78 11.3-7.34C78 6.76 80.34 5.1 83.87 3.42 88.56 1.16 93.75 0 100 0v6.16C98.76 6.05 97.43 6 96 6c-9.59 0-14.23 2.23-23.13 9.34-1.28 1.03-2.39 1.9-3.4 2.66h-7.65zm-23.64 0H22.52c-1-.76-2.1-1.63-3.4-2.66C11.57 9.3 7.08 6.78 0 6.16V0c6.25 0 11.44 1.16 16.14 3.42 3.53 1.7 5.87 3.35 10.73 7.24 4.45 3.56 7.84 5.9 11.31 7.34zM61.82 0h7.66a39.57 39.57 0 0 1-7.34 4.58C57.44 6.84 52.25 8 46 8S34.56 6.84 29.86 4.58A39.57 39.57 0 0 1 22.52 0h15.66C41.65 1.44 45.21 2 50 2c4.8 0 8.35-.56 11.82-2z'%3E%3C/path%3E%3C/svg%3E");
      margin: 0;
      padding: 0;
    }

    .container {
      margin: 40px auto;
      padding: 0 20px;
      max-width: 1400px;
    }

    .split {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 30px;
      align-items: stretch;
    }

    .image-wrapper {
      width: 100%;
      height: 100%;
      display: flex;
    }

    img {
      border-radius: 5px;
      border: 5px solid #e5ba55;
      border-style: inset;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      box-sizing: border-box;
    }

    .right {
      background-color: #0ca1bc;
      padding: 30px;
      color: rgb(247, 245, 245);
      border-radius: 5px;
      border: 5px solid #e5ba55;
      border-style: inset;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-sizing: border-box;
    }

    h1 {
      font-size: 2.5rem;
      margin-top: 0;
      color: #f7d070;
    }

    h2 {
      font-size: 1.25rem;
      font-weight: normal;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      height: auto;
      display: block;
      margin-bottom: 20px;
      border-radius: 6px;
      border: none;
      position: relative;
      z-index: 5;
    }

    .beach-btn {
      position: relative;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      width: 220px;
      height: 45px;
      background-color: #f7d070;
      border: 2px solid #e5ba55;
      border-radius: 30px;
      text-decoration: none;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(247, 208, 112, 0.3);
      transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
      margin-top: 15px;
    }

    .beach-btn .btn-text {
      position: relative;
      z-index: 2;
      font-family: "Arial", sans-serif;
      font-size: 16px;
      font-weight: bold;
      color: #2c3e50;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: color 0.4s ease;
    }

    .beach-btn .wave-bg {
      position: absolute;
      top: 100%;
      left: -50%;
      width: 200%;
      height: 400%;
      background: #0c73bc;
      border-radius: 40%;
      z-index: 1;
      transition: top 0.6s ease;
    }

    .beach-btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(52, 152, 219, 0.4);
    }

    .beach-btn:hover .btn-text {
      color: #ffffff;
    }

    .beach-btn:hover .wave-bg {
      top: -60%;
      animation: ocean-wave 4s linear infinite;
    }

    @keyframes ocean-wave {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 900px) {
      .container {
        margin: 20px auto;
        padding: 0 15px;
      }
      .split {
        grid-template-columns: 1fr;
        gap: 20px;
      }
      .image-wrapper {
        height: 400px;
      }
      img {
        height: 100%;
      }
      h1 {
        font-size: 2.2rem;
      }
    }

    @media (max-width: 480px) {
      .container {
        margin: 10px auto;
        padding: 0 10px;
      }
      .split {
        gap: 15px;
      }
      .image-wrapper {
        height: 250px;
      }
      .right {
        padding: 20px;
      }
      h1 {
        font-size: 1.8rem;
      }
      h2 {
        font-size: 1.1rem;
      }
      .beach-btn {
        width: 100%;
      }
    }
  </style>
  <body>
    <div class="container">
      <div class="split">
        <div class="image-wrapper">
          <img src="Images/dancing.jpg" alt="beach" />
        </div>

        <div class="right">
          <div>
            <h1>Genieße Goa!</h1>
            <h2>
              Wenn du nach dem Trubel der Großstädte entspannen willst, bieten
              die Strände im Süden von Goa (z. B. Palolem) ruhige Tage unter
              Palmen, während der Norden für seine Hippie-Märkte und Partys
              bekannt ist.
            </h2>

            <iframe
              src="https://www.youtube.com/embed/2_oidgGWULs"
              title="Goa Indien: Warum wir fast nicht hingefahren wären"
              allow="
                accelerometer;
                autoplay;
                clipboard-write;
                encrypted-media;
                gyroscope;
                picture-in-picture;
                web-share;
              "
              referrerpolicy="strict-origin-when-cross-origin"
              allowfullscreen
            >
            </iframe>

            <iframe
              src="https://www.youtube.com/embed/47Xmj4m4HSc"
              title="Das Indien, von dem dir keiner erzählt • GOA INDIEN DOKU"
              allow="
                accelerometer;
                autoplay;
                clipboard-write;
                encrypted-media;
                gyroscope;
                picture-in-picture;
                web-share;
              "
              referrerpolicy="strict-origin-when-cross-origin"
              allowfullscreen
            >
            </iframe>

            <iframe
              src="https://www.youtube.com/embed/giTAAbYcaqk"
              title="EXPLORING GOA from NORTH to SOUTH 🇮🇳 Looking for the best beach! India vlog"
              allow="
                accelerometer;
                autoplay;
                clipboard-write;
                encrypted-media;
                gyroscope;
                picture-in-picture;
                web-share;
              "
              referrerpolicy="strict-origin-when-cross-origin"
              allowfullscreen
            >
            </iframe>
          </div>

          <a href="india6.html" class="beach-btn">
            <span class="btn-text">weiter geht's</span>
            <span class="wave-bg"></span>
          </a>
        </div>
      </div>
    </div>
    <br /><br />
  </body>
</html>
